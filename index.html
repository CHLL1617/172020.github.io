<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小花画家的花园美术馆</title>
<!-- 引入中文字体 -->
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
    /* --- 全局样式 --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'ZCOOL XiaoWei', serif;
        background-color: #fdf6e3; /* 暖米色背景 */
        color: #5d4037;
        overflow-x: hidden;
    }

    /* --- 头部导航 --- */
    header {
        text-align: center;
        padding: 40px 20px;
        background: linear-gradient(to bottom, #fff, #fdf6e3);
    }
    h1 {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 3rem;
        color: #ff8a80;
        text-shadow: 2px 2px 0px #fff;
        margin-bottom: 10px;
    }
    p.subtitle {
        font-size: 1.2rem;
        color: #8d6e63;
    }

    /* --- 画廊网格 --- */
    .gallery-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 30px;
    }

    .art-card {
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 10px 20px rgba(93, 64, 55, 0.1);
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
        border: 4px solid #fff;
    }

    .art-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 30px rgba(93, 64, 55, 0.2);
        border-color: #ffccbc;
    }

    .img-wrapper {
        width: 100%;
        height: 250px;
        background-color: #eee;
        overflow: hidden;
        position: relative;
    }

    .img-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* 保持比例填充 */
        transition: transform 0.5s ease;
    }

    .art-card:hover .img-wrapper img {
        transform: scale(1.1);
    }

    .card-info {
        padding: 20px;
        text-align: center;
    }

    .card-info h3 {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 1.5rem;
        color: #ef5350;
        margin-bottom: 5px;
    }

    .card-info p {
        font-size: 0.9rem;
        color: #a1887f;
    }

    /* --- 弹窗详情 (Lightbox) --- */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(253, 246, 227, 0.95);
        backdrop-filter: blur(5px);
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    .modal-content {
        max-width: 90%;
        max-height: 80vh;
        border-radius: 10px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        border: 8px solid #fff;
    }

    .modal-text {
        margin-top: 20px;
        text-align: center;
        max-width: 600px;
        padding: 0 20px;
    }

    .modal-text h2 {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 2rem;
        color: #ff7043;
    }

    .modal-text .artist-note {
        font-style: italic;
        color: #8d6e63;
        margin-top: 10px;
        background: #fff;
        padding: 10px 20px;
        border-radius: 20px;
        display: inline-block;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .close-btn {
        position: absolute;
        top: 30px;
        right: 40px;
        font-size: 40px;
        color: #5d4037;
        cursor: pointer;
        transition: color 0.3s;
    }
    .close-btn:hover { color: #ff5252; }

    /* --- 装饰性蝴蝶 --- */
    .butterfly {
        position: fixed;
        font-size: 24px;
        opacity: 0.6;
        animation: float 10s infinite linear;
        z-index: -1;
    }
    @keyframes float {
        0% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(20px, -20px) rotate(10deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
    }

</style>
</head>
<body>

    <!-- 装饰蝴蝶 -->
    <div class="butterfly" style="top: 10%; left: 10%;">🦋</div>
    <div class="butterfly" style="top: 20%; right: 15%; animation-delay: 2s;">🦋</div>
    <div class="butterfly" style="top: 60%; left: 5%; animation-delay: 4s;">🌸</div>

    <header>
        <h1>🎨 小花画家的花园美术馆</h1>
        <p class="subtitle">欢迎来到我的色彩世界，请慢慢欣赏 ~</p>
    </header>

    <div class="gallery-container" id="gallery">
        <!-- 这里的卡片会由 JS 自动生成 -->
    </div>

    <!-- 弹窗结构 -->
    <div id="myModal" class="modal">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="modalImg">
        <div class="modal-text">
            <h2 id="modalTitle"></h2>
            <p id="modalDesc"></p>
            <div class="artist-note" id="modalNote"></div>
        </div>
    </div>

<script>
    // === 画作数据配置 ===
    // 这里配置图片文件名（必须和上传到GitHub的名字一模一样，区分大小写）
    const artworks = [
        {
            src: "img1.jpg", 
            title: "彩虹仙人掌",
            desc: "谁说仙人掌只有绿色？在我的梦里，它们穿上了彩虹色的毛衣！",
            note: "💡 创作灵感：使用了彩铅叠色法，尝试了粉蓝黄的渐变。"
        },
        {
            src: "img2.jpg", 
            title: "我的奇妙世界",
            desc: "这是线条的迷宫，里面藏着好多好多小秘密，你能找到吗？",
            note: "💡 创作灵感：随手涂鸦的线描练习，记录当下的胡思乱想。"
        },
        {
            src: "img3.jpg", 
            title: "镜中的小湖",
            desc: "圆圆的窗户里，藏着一个安静的午后。树影倒映在水里，时间都慢下来了。",
            note: "💡 创作灵感：素描光影练习，重点表现了水面的倒影质感。"
        },
        {
            src: "img4.jpg", 
            title: "最好的朋友",
            desc: "两只小鸟在说悄悄话呢。黄色的是开心果，绿色的是守护者。",
            note: "💡 创作灵感：观察了家里的鹦鹉，想画出它们相亲相爱的样子。"
        },
        {
            src: "img5.jpg", 
            title: "怪兽大聚会",
            desc: "虽然它们长得奇奇怪怪，有的甚至有点凶，但其实它们都很善良哦！",
            note: "💡 创作灵感：脑洞大开的角色设计课作业，每一个都有名字。"
        }
    ];

    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('myModal');
    const modalImg = document.getElementById('modalImg');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const modalNote = document.getElementById('modalNote');
    const closeBtn = document.getElementsByClassName('close-btn')[0];

    // 生成画廊卡片
    artworks.forEach((art, index) => {
        const card = document.createElement('div');
        card.className = 'art-card';
        
        // 如果图片加载失败，显示一个带颜色的占位块
        const fallbackColor = `hsl(${index * 60}, 70%, 80%)`;
        
        card.innerHTML = `
            <div class="img-wrapper">
                <img src="${art.src}" alt="${art.title}" onerror="this.style.display='none'; this.parentElement.style.backgroundColor='${fallbackColor}'; this.parentElement.innerHTML='<div style=\'display:flex;justify-content:center;align-items:center;height:100%;color:#5d4037;font-size:1.5rem;\'>🖼️ ${art.title}</div>'">
            </div>
            <div class="card-info">
                <h3>${art.title}</h3>
                <p>点击查看大图</p>
            </div>
        `;
        
        // 点击事件
        card.onclick = function() {
            modal.style.display = "flex";
            modalImg.src = art.src;
            modalTitle.innerText = art.title;
            modalDesc.innerText = art.desc;
            modalNote.innerText = art.note;
        }
        
        gallery.appendChild(card);
    });

    // 关闭弹窗逻辑
    closeBtn.onclick = function() {
        modal.style.display = "none";
    }
    
    window.onclick = function(event) {
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }
</script>

</body>
</html>
