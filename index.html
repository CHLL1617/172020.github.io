<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>小花画家的花园美术馆</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'ZCOOL XiaoWei',-apple-system,'PingFang SC','Microsoft YaHei',serif;background:#fdf6e3;color:#4a3728;line-height:1.7;overflow-x:hidden}

/* ===== 蝴蝶 ===== */
.bf{position:fixed;pointer-events:none;z-index:1;opacity:.5;font-size:28px}
.b1{top:12%;left:4%;animation:f1 14s ease-in-out infinite}
.b2{top:55%;right:3%;animation:f2 18s ease-in-out infinite}
.b3{top:30%;right:8%;animation:f3 12s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(40px,-30px) rotate(8deg)}50%{transform:translate(10px,-60px) rotate(-5deg)}75%{transform:translate(-20px,-20px) rotate(3deg)}}
@keyframes f2{0%,100%{transform:translate(0,0) rotate(0)}30%{transform:translate(-35px,-45px) rotate(-10deg)}60%{transform:translate(-15px,20px) rotate(6deg)}80%{transform:translate(25px,-15px) rotate(-4deg)}}
@keyframes f3{0%,100%{transform:translate(0,0) rotate(0)}40%{transform:translate(30px,25px) rotate(12deg)}70%{transform:translate(-10px,50px) rotate(-8deg)}}

/* ===== 导航 ===== */
header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,rgba(255,236,183,.95),rgba(255,209,156,.92));border-bottom:2px solid rgba(210,150,70,.3)}
header .wrap{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;padding:0 20px;height:60px}
.logo{font-family:'Ma Shan Zheng',cursive;font-size:24px;color:#c96a30;letter-spacing:3px}
.logo small{font-size:13px;color:#b07040;font-family:'ZCOOL XiaoWei',serif;margin-left:8px}
nav a{margin-left:18px;font-size:15px;color:#8b6f47;position:relative;padding:4px 0;text-decoration:none;display:inline-block}
nav a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:#c96a30;transition:width .3s}
nav a:hover,nav a.on{color:#c96a30}
nav a:hover::after,nav a.on::after{width:100%}
.menu-btn{display:none;background:none;border:none;font-size:26px;color:#c96a30;cursor:pointer}
.nav-links{display:flex;align-items:center}

/* ===== 英雄区 ===== */
.hero{position:relative;background:linear-gradient(180deg,#ffe4a0 0%,#ffd580 12%,#ffb366 28%,#ff8c5a 42%,#e8704a 55%,#d4603a 65%,#a098b0 78%,#8a95a8 88%,#7b88a0 100%);padding:70px 20px 90px;text-align:center;overflow:hidden}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(0deg,#fdf6e3,transparent)}
.hero .sun{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#fff5c0 0%,#ffd54f 35%,rgba(255,183,77,0) 70%);position:absolute;top:12%;left:50%;transform:translateX(-50%);animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{0%{box-shadow:0 0 40px rgba(255,200,50,.3)}100%{box-shadow:0 0 80px rgba(255,200,50,.6)}}
.hero h1{font-family:'Ma Shan Zheng',cursive;font-size:46px;color:#fff;text-shadow:2px 2px 14px rgba(200,100,30,.5);position:relative;letter-spacing:6px}
.hero>p{color:rgba(255,255,255,.92);font-size:17px;position:relative;max-width:600px;margin:12px auto}
.hero .qb{display:inline-block;position:relative;margin-top:18px;padding:14px 26px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);border-radius:20px;font-style:italic;color:#fff;font-size:16px}

/* ===== 主内容 ===== */
.main{max-width:1100px;margin:0 auto;padding:30px 20px 60px}
.sec-title{font-family:'Ma Shan Zheng',cursive;font-size:26px;color:#c96a30;margin:36px 0 18px;padding-bottom:10px;border-bottom:2px solid rgba(210,150,70,.25);display:flex;align-items:center;gap:10px}
.sec-title::before{content:'\1f33f';font-size:20px}

/* ===== 卡片 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:#fff;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 4px 16px rgba(200,150,80,.1);transition:all .3s;border:3px solid #f0dcc0;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#ff8c5a,#ffd54f,#e8704a);opacity:0;transition:opacity .3s;z-index:2}
.card:hover{transform:translateY(-6px);box-shadow:0 12px 32px rgba(200,130,60,.2)}
.card:hover::before{opacity:1}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#f5ead8}
.card .info{padding:14px 16px}
.card .info .t{font-family:'Ma Shan Zheng',cursive;font-size:20px;color:#c96a30}
.card .info .m{font-size:13px;color:#a08560;margin-top:4px}

/* ===== 展厅头 ===== */
.hall-hd{display:flex;align-items:center;gap:14px;margin:36px 0 16px;padding:16px 20px;background:linear-gradient(135deg,rgba(255,220,170,.3),rgba(255,200,130,.2));border-radius:16px;border-left:5px solid #e8704a}
.hall-hd h3{font-family:'Ma Shan Zheng',cursive;font-size:26px;color:#c96a30}
.hall-hd span{color:#a08560;font-size:14px}

/* ===== 未来展厅 ===== */
.future{border:3px dashed #e8704a;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:3/4;background:linear-gradient(135deg,rgba(255,200,130,.15),rgba(255,150,90,.08));color:#c96a30;font-family:'Ma Shan Zheng',cursive;font-size:22px;text-align:center;padding:20px}
.future small{font-family:'ZCOOL XiaoWei',serif;font-size:14px;color:#a08560;margin-top:8px}

/* ===== 弹窗 ===== */
.modal-ov{position:fixed;inset:0;background:rgba(60,30,10,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200}
.modal-ov[hidden]{display:none}
.modal-sh{background:#fffdf5;border-radius:20px;max-width:800px;width:100%;max-height:88vh;overflow-y:auto;padding:28px;box-shadow:0 20px 60px rgba(80,40,10,.2);border:2px solid #f0dcc0;position:relative}
.modal-sh img{width:100%;border-radius:14px;border:4px solid #f0dcc0;margin-bottom:16px}
.modal-sh .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:#8b6f47;margin-bottom:14px}
.modal-sh .meta b{color:#c96a30}
.modal-sh .qb2{background:linear-gradient(135deg,#fff5e6,#ffe8cc);border-left:4px solid #e8704a;border-radius:0 14px 14px 0;padding:16px 20px;margin:16px 0;font-family:'Ma Shan Zheng',cursive;font-size:20px;color:#c96a30}
.modal-sh .note{background:#f5f0e8;border-radius:12px;padding:14px 16px;font-size:15px;color:#6b5a48;margin:12px 0}
.modal-sh .note b{color:#c96a30}
.modal-x{position:absolute;top:12px;right:16px;font-size:28px;color:#a08560;cursor:pointer;background:none;border:none;line-height:1}
.modal-x:hover{color:#c96a30}
.btn{display:inline-block;margin:14px 10px 0 0;padding:10px 22px;border-radius:14px;border:2px solid #e8704a;background:linear-gradient(135deg,#e8704a,#d4603a);color:#fff;cursor:pointer;font-family:inherit;font-size:15px;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(232,112,74,.3)}
.btn.gh{background:transparent;color:#e8704a}

/* ===== 对照墙 ===== */
.theme-sec{margin:30px 0;padding:20px;background:#fff;border-radius:16px;border:2px solid #f0dcc0}
.theme-sec h3{font-family:'Ma Shan Zheng',cursive;font-size:24px;color:#c96a30;margin-bottom:6px}
.theme-sec>p{color:#a08560;font-size:14px;margin-bottom:14px}
.theme-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.theme-row img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:3px solid #f0dcc0;cursor:pointer;transition:transform .2s}
.theme-row img:hover{transform:scale(1.03)}
.theme-row .lbl{text-align:center;font-size:13px;color:#8b6f47;margin-top:6px}

/* ===== 猜年龄 ===== */
.game-area{max-width:520px;margin:auto;text-align:center}
.game-area img{width:100%;border-radius:16px;border:4px solid #f0dcc0}
.game-area .q{font-family:'Ma Shan Zheng',cursive;font-size:22px;color:#c96a30;margin:16px 0}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0}
.opts .opt{padding:12px 24px;border:2px solid #e8704a;border-radius:14px;background:#fff;color:#e8704a;cursor:pointer;font-size:16px;font-family:'Ma Shan Zheng',cursive;transition:all .2s}
.opts .opt:hover{background:#e8704a;color:#fff}
.opts .opt.ok{background:#4caf50!important;border-color:#4caf50!important;color:#fff!important}
.opts .opt.no{background:#9e9e9e!important;border-color:#9e9e9e!important;color:#fff!important}
.gmsg{font-size:18px;min-height:30px;margin:10px 0;font-family:'Ma Shan Zheng',cursive}
.stats{color:#a08560;font-size:14px}

/* ===== 留言 ===== */
.book-area{max-width:640px;margin:auto}
.book-area input,.book-area textarea{width:100%;padding:14px;border:2px solid #f0dcc0;border-radius:14px;font-family:inherit;font-size:15px;background:#fffdf5;margin-bottom:12px}
.book-area input:focus,.book-area textarea:focus{outline:none;border-color:#e8704a}
.msg-cd{background:#fff;border-radius:14px;padding:16px;margin:10px 0;border-left:4px solid #e8704a;box-shadow:0 2px 8px rgba(200,150,80,.08)}
.msg-cd .who{font-family:'Ma Shan Zheng',cursive;font-size:18px;color:#c96a30}
.msg-cd .tm{font-size:12px;color:#a08560}

/* ===== 索引 ===== */
.idx-tb{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;border:2px solid #f0dcc0}
.idx-tb th{background:linear-gradient(135deg,#ffe4b8,#ffd599);color:#8b5e34;font-size:14px;padding:12px 14px}
.idx-tb td{padding:10px 14px;border-top:1px solid #f0dcc0;font-size:14px;cursor:pointer}
.idx-tb tr:hover td{background:rgba(255,200,130,.12)}

footer{text-align:center;padding:40px 20px 30px;color:#a08560;font-size:13px;background:linear-gradient(180deg,transparent,rgba(255,220,170,.2))}

@media(max-width:680px){
.hero h1{font-size:30px;letter-spacing:3px}
.hero p,.hero>.qb{font-size:14px}
.hero{padding:46px 16px 66px}
.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
nav a{margin-left:10px;font-size:13px}
.sec-title{font-size:21px}
.menu-btn{display:block}
.nav-links{display:none}
.nav-links.open{display:flex;position:absolute;top:60px;right:0;left:0;background:rgba(255,236,183,.97);flex-direction:column;padding:16px;box-shadow:0 8px 24px rgba(200,150,80,.15);z-index:10}
.nav-links.open a{margin:8px 0}
}
</style>
</head>
<body>

<div class="bf b1"></div>
<div class="bf b2"></div>
<div class="bf b3"></div>

<header>
<div class="wrap">
  <div class="logo">小花画家的花园美术馆 <small>🌸</small></div>
  <button class="menu-btn" onclick="document.getElementById('nv').classList.toggle('open')">☰</button>
  <nav id="nv" class="nav-links">
    <a href="#/" onclick="go('/')">首页</a>
    <a href="#/halls" onclick="go('halls')">花园展厅</a>
    <a href="#/themes" onclick="go('themes')">时光墙</a>
    <a href="#/game" onclick="go('game')">猜年龄</a>
    <a href="#/book" onclick="go('book')">留言本</a>
    <a href="#/index" onclick="go('index')">藏品目录</a>
  </nav>
</div>
</header>

<main class="main" id="app"></main>

<footer>🌸 每一笔都是一个世界 · 私人分享 🌸</footer>

<div class="modal-ov" id="modal" hidden>
<div class="modal-sh">
  <button class="modal-x" onclick="closeModal()">✕</button>
  <div id="sheetBody"></div>
</div>
</div>

<script>
/* ===== 配置 ===== */
var CFG={name:"小花画家",born:2016,
intro:"她从三岁开始画画，把看到的世界用颜色讲出来。每幅画都是她心里的一座花园。",
quote:"我画的是我梦里的仙人掌，它会开出彩虹色的花。",
futureAge:18};

/* ===== 作品数据（5幅真实作品）===== */
/* img字段：把照片放入 works/ 文件夹后，填 "works/img1.jpg" 等即可 */
var WORKS=[
{id:1,title:"彩虹仙人掌",age:7,date:"2023-03-15",medium:"彩铅",size:"A4",img:"works/img1.jpg",
 quote:"仙人掌不是只有绿色的，它心里有彩虹。",
 note:"这幅画她用了五种颜色渐变，画了两节课。每一根小刺都认真地画了上去。"},

{id:2,title:"我的奇妙世界",age:4,date:"2020-08-20",medium:"铅笔",size:"A4",img:"works/img2.jpg",
 quote:"这里有小人、有怪兽、还有我想象的大河。",
 note:"四岁时的涂鸦，纸上有水渍和折痕，但那是她第一次画出了「场景」。"},

{id:3,title:"镜中的小湖",age:8,date:"2024-11-10",medium:"铅笔素描",size:"A4",img:"works/img3.jpg",
 quote:"我画了一个圆，像从望远镜看过去的风景。",
 note:"第一次尝试圆形构图和远近透视。远山、小路、房子、树影都安排得很有耐心。"},

{id:4,title:"最好的朋友",age:8,date:"2025-02-14",medium:"彩铅",size:"A4",img:"works/img4.jpg",
 quote:"两只小鸟在亲亲，因为它们是好朋友。",
 note:"情人节那天画的。她说一黄一绿配在一起最好看，还认真画了每根羽毛。"},

{id:5,title:"我的怪兽朋友们",age:6,date:"2022-10-05",medium:"铅笔素描",size:"A4",img:"works/img5.jpg",
 quote:"这些是我的怪兽朋友，有的凶有的可爱，但它们都很善良。",
 note:"一整张纸画满了各种角色，还有她写的台词和对话气泡。这是她最爱的「怪兽宇宙」。"}
];

/* ===== 时光对照 ===== */
var THEMES=[
{title:"色彩的成长",desc:"从铅笔涂鸦到彩色渐变，看她的色彩怎么丰富起来。",ids:[2,1,4]},
{title:"她的怪兽宇宙",desc:"从四岁的涂鸦到六岁的怪兽集合，想象力的轨迹。",ids:[2,5]}
];

/* ===== 示例画布 ===== */
function makePh(w){
  var cs=[["#ffe4b8","#e8704a"],["#d8e6d0","#6f9c77"],["#d6e4f0","#5b87b8"],["#f0e0d8","#a86f57"],["#e8d8f0","#8a6fc9"]];
  var c=cs[(w.id-1)%cs.length];
  var s="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 800' width='600' height='800'>"+
    "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>"+
    "<stop offset='0' stop-color='"+c[0]+"'/>"+
    "<stop offset='1' stop-color='"+c[1]+"'/>"+
    "</linearGradient></defs>"+
    "<rect width='600' height='800' fill='url(#g)' rx='16'/>"+
    "<text x='300' y='380' font-size='42' text-anchor='middle' fill='#fff' font-family='serif'>"+
    escSvg(w.title)+"</text>"+
    "<text x='300' y='440' font-size='22' text-anchor='middle' fill='rgba(255,255,255,.85)' font-family='serif'>"+
    w.age+" 岁 · "+w.medium+"</text>"+
    "<text x='300' y='490' font-size='18' text-anchor='middle' fill='rgba(255,255,255,.6)' font-family='serif'>示例画布</text></svg>";
  return "data:image/svg+xml;charset=utf-8,"+s;
}
function escSvg(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function src(w){return w.img?w.img:makePh(w);}
function byId(id){for(var i=0;i<WORKS.length;i++){if(WORKS[i].id===id)return WORKS[i];}return null;}
function pad(n){var s="00"+n;return s.substr(s.length-3);}
function getAges(){var a=[];for(var i=0;i<WORKS.length;i++){if(a.indexOf(WORKS[i].age)===-1)a.push(WORKS[i].age);}return a.sort(function(x,y){return x-y;});}
function countAge(a){var n=0;for(var i=0;i<WORKS.length;i++){if(WORKS[i].age===a)n++;}return n;}

/* ===== 卡片HTML ===== */
function cardH(w){
  return "<div class='card' onclick='openWork("+w.id+")'>"+
    "<img src='"+src(w)+"' alt='"+escSvg(w.title)+"' loading='lazy'>"+
    "<div class='info'><div class='t'>"+escSvg(w.title)+"</div>"+
    "<div class='m'>NO."+pad(w.id)+" · "+w.age+"岁 · "+escSvg(w.medium)+"</div></div></div>";
}

/* ===== 首页 ===== */
function rHome(){
  var ages=getAges();
  var h="<section class='hero'><div class='sun'></div>"+
    "<h1>小花画家的花园美术馆</h1>"+
    "<p>"+CFG.name+" · "+CFG.born+" 年至今 · 共 "+WORKS.length+" 件藏品</p>"+
    "<p style='max-width:560px;margin:10px auto'>"+CFG.intro+"</p>"+
    "<div class='qb'>"+CFG.quote+"</div></section>"+
    "<h2 class='sec-title'>花园展厅导航</h2><div class='grid'>";
  for(var i=0;i<ages.length;i++){
    var a=ages[i];
    h+="<div class='card' onclick=\"location.hash='#/halls/"+a+"'\">"+
      "<div style='padding:28px;text-align:center;background:linear-gradient(135deg,#fff5e6,#ffe8cc)'>"+
      "<div style='font-family:\"Ma Shan Zheng\",cursive;font-size:30px;color:#c96a30'>"+a+" 岁厅</div>"+
      "<div class='info' style='padding:8px 0 0'><span class='m'>"+countAge(a)+" 件作品</span></div></div></div>";
  }
  h+="<div class='future'><div>"+CFG.futureAge+" 岁的我</div><small>待完成 · 花园还会长大</small></div></div>";
  return h;
}

/* ===== 展厅 ===== */
function rHalls(age){
  var ages=getAges();
  var h="<h2 class='sec-title'>花园展厅 · 按年分厅</h2>";
  for(var i=0;i<ages.length;i++){
    var a=ages[i];
    if(age&&String(a)!==String(age))continue;
    var list=[];
    for(var j=0;j<WORKS.length;j++){if(WORKS[j].age===a)list.push(WORKS[j]);}
    h+="<div class='hall-hd'><h3>"+a+" 岁厅 🌸</h3><span>"+list.length+" 件作品</span></div><div class='grid'>";
    for(var k=0;k<list.length;k++){h+=cardH(list[k]);}
    h+="</div>";
  }
  return h;
}

/* ===== 作品详情 ===== */
function openWork(id){
  var w=byId(id);if(!w)return;
  var h="<img src='"+src(w)+"' alt='"+escSvg(w.title)+"'>";
  h+="<div class='meta'><span><b>"+escSvg(w.title)+"</b></span>";
  h+="<span>NO."+pad(w.id)+"</span><span>"+w.date+"</span><span>"+w.age+" 岁</span>";
  h+="<span>"+escSvg(w.medium)+"</span>"+(w.size?"<span>"+w.size+"</span>":"")+"</div>";
  h+="<div class='qb2'>"+escSvg(w.quote)+"<div style='color:#a08560;font-size:14px;margin-top:8px;font-family:\"ZCOOL XiaoWei\",serif'>—— 她自己说的</div></div>";
  if(w.note)h+="<div class='note'><b>🌿 家长注脚：</b>"+escSvg(w.note)+"</div>";
  h+="<button class='btn' onclick='printCard("+w.id+")'>🖼 保存作品卡</button>";
  h+="<button class='btn gh' onclick='closeModal()'>关闭</button>";
  document.getElementById("sheetBody").innerHTML=h;
  document.getElementById("modal").hidden=false;
  document.body.style.overflow="hidden";
}
function closeModal(){document.getElementById("modal").hidden=true;document.body.style.overflow="";}
document.getElementById("modal").addEventListener("click",function(e){if(e.target.id==="modal")closeModal();});

function printCard(id){
  var w=byId(id);if(!w)return;
  var pw=window.open("","_blank");
  var html="<!DOCTYPE html><html><head><meta charset='UTF-8'><title>藏品卡</title>"+
    "<link href='https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap' rel='stylesheet'>"+
    "<style>body{margin:0;padding:30px;text-align:center;font-family:'Ma Shan Zheng',serif;background:#fdf6e3}"+
    "h2{color:#c96a30;font-size:26px;letter-spacing:4px}img{max-width:480px;width:100%;border:4px solid #f0dcc0;border-radius:12px;margin:14px 0}"+
    ".info{font-size:15px;color:#8b6f47;margin:8px 0}.quote{font-size:18px;color:#c96a30;margin:14px 0;font-style:italic}"+
    ".foot{color:#a08560;font-size:12px;margin-top:20px}</style></head><body>"+
    "<h2>"+CFG.name+" · 藏品卡</h2>"+
    "<img src='"+src(w)+"'>"+
    "<div class='info'>NO."+pad(w.id)+" · "+escSvg(w.title)+" · "+w.age+" 岁 · "+escSvg(w.medium)+" · "+w.date+"</div>"+
    "<div class='quote'>"+escSvg(w.quote)+"</div>"+
    "<div class='foot'>"+CFG.name+"的花园美术馆 · 私人藏品</div></body></html>";
  pw.document.write(html);
  pw.document.close();
  setTimeout(function(){pw.print();},500);
}

/* ===== 时光对照墙 ===== */
function rThemes(){
  var h="<h2 class='sec-title'>时光对照墙</h2>";
  for(var i=0;i<THEMES.length;i++){
    var t=THEMES[i];
    h+="<div class='theme-sec'><h3>"+escSvg(t.title)+"</h3><p>"+escSvg(t.desc)+"</p><div class='theme-row'>";
    for(var j=0;j<t.ids.length;j++){
      var w=byId(t.ids[j]);if(!w)continue;
      h+="<div><img src='"+src(w)+"' onclick='openWork("+w.id+")' alt='"+escSvg(w.title)+"'>"+
        "<div class='lbl'>"+w.age+" 岁 · "+escSvg(w.title)+"</div></div>";
    }
    h+="</div></div>";
  }
  return h;
}

/* ===== 猜年龄 ===== */
var GS={cur:null,right:0,total:0};
function rGame(){
  var pool=[];for(var i=0;i<WORKS.length;i++)pool.push(WORKS[i]);
  GS.cur=pool[Math.floor(Math.random()*pool.length)];
  var ages=getAges();
  var h="<h2 class='sec-title'>猜猜她几岁画的 🦋</h2>"+
    "<div class='game-area'>"+
    "<img src='"+src(GS.cur)+"' alt='"+escSvg(GS.cur.title)+"'>"+
    "<div class='q'>这幅《"+escSvg(GS.cur.title)+"》是她几岁时画的？</div>"+
    "<div class='opts' id='opts'>";
  for(var i=0;i<ages.length;i++)h+="<span class='opt' onclick='guess("+ages[i]+",this)'>"+ages[i]+" 岁</span>";
  h+="</div><div class='gmsg' id='gmsg'></div>"+
    "<button class='btn gh' onclick='rGameInner()' style='margin-top:10px'>换一幅</button>"+
    "<div class='stats' style='margin-top:10px'>已答 "+GS.total+" 题，答对 "+GS.right+" 题</div></div>";
  return h;
}
function guess(age,el){
  var ok=(age===GS.cur.age);
  GS.total++;if(ok)GS.right++;
  var msg=document.getElementById("gmsg");
  msg.textContent=ok?"🎉 答对了！就是 "+age+" 岁！":"差一点，其实是 "+GS.cur.age+" 岁哦。";
  msg.style.color=ok?"#4caf50":"#e8704a";
  var opts=document.querySelectorAll("#opts .opt");
  for(var i=0;i<opts.length;i++){
    opts[i].style.pointerEvents="none";
    var v=parseInt(opts[i].textContent);
    if(v===GS.cur.age)opts[i].classList.add("ok");
    else if(v===age&&!ok)opts[i].classList.add("no");
  }
}
function rGameInner(){
  var pool=[];for(var i=0;i<WORKS.length;i++)pool.push(WORKS[i]);
  GS.cur=pool[Math.floor(Math.random()*pool.length)];
  var ages=getAges();
  var h="<img src='"+src(GS.cur)+"' alt='"+escSvg(GS.cur.title)+"' style='width:100%;border-radius:16px;border:4px solid #f0dcc0'>"+
    "<div class='q'>这幅《"+escSvg(GS.cur.title)+"》是她几岁时画的？</div>"+
    "<div class='opts' id='opts'>";
  for(var i=0;i<ages.length;i++)h+="<span class='opt' onclick='guess("+ages[i]+",this)'>"+ages[i]+" 岁</span>";
  h+="</div><div class='gmsg' id='gmsg'></div>"+
    "<button class='btn gh' onclick='rGameInner()' style='margin-top:10px'>换一幅</button>"+
    "<div class='stats' style='margin-top:10px'>已答 "+GS.total+" 题，答对 "+GS.right+" 题</div>";
  var area=document.querySelector(".game-area");
  if(area)area.innerHTML=h;
}

/* ===== 留言本 ===== */
var MK="hy_gb";
function loadMsg(){try{return JSON.parse(localStorage.getItem(MK)||"[]");}catch(e){return[];}}
function rBook(){
  var list=loadMsg().slice().reverse();
  var h="<h2 class='sec-title'>观众留言墙 🌺</h2>"+
    "<div class='book-area'>"+
    "<input id='gn' placeholder='你的名字（昵称就好）' maxlength='20'>"+
    "<textarea id='gm' rows='3' placeholder='写一句想对小花画家说的话' maxlength='200'></textarea>"+
    "<button class='btn' onclick='addMsg()'>🌸 留下留言</button> "+
    "<button class='btn gh' onclick='exportMsg()'>导出留言</button>"+
    "<div id='mlist' style='margin-top:20px'>";
  if(list.length){
    for(var i=0;i<list.length;i++){
      h+="<div class='msg-cd'><span class='who'>"+esc(list[i].n)+"</span> <span class='tm'>"+list[i].t+"</span>"+
        "<div style='margin-top:6px'>"+esc(list[i].m)+"</div></div>";
    }
  }else{
    h+="<p style='color:#a08560;text-align:center'>还没有留言，来当第一个观众吧 🌸</p>";
  }
  h+="</div></div>";
  return h;
}
function addMsg(){
  var nEl=document.getElementById("gn");
  var mEl=document.getElementById("gm");
  var n=nEl?nEl.value.trim():"";
  var m=mEl?mEl.value.trim():"";
  if(!n)n="热心观众";
  if(!m){alert("请先写点内容哦 🌸");return;}
  var arr=loadMsg();
  var now=new Date();
  var ts=now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(now.getDate())+" "+p2(now.getHours())+":"+p2(now.getMinutes());
  arr.push({n:n,m:m,t:ts});
  try{localStorage.setItem(MK,JSON.stringify(arr));}catch(e){}
  render();
}
function exportMsg(){
  var arr=loadMsg();
  var blob=new Blob([JSON.stringify(arr,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="花园美术馆_留言.json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function p2(n){return n<10?"0"+n:""+n;}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}

/* ===== 藏品索引 ===== */
function rIndex(){
  var sorted=WORKS.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  var h="<h2 class='sec-title'>藏品目录 📖</h2>"+
    "<table class='idx-tb'><tr><th>编号</th><th>标题</th><th>年龄</th><th>日期</th><th>媒介</th><th>尺寸</th></tr>";
  for(var i=0;i<sorted.length;i++){
    var w=sorted[i];
    h+="<tr onclick='openWork("+w.id+")'><td>NO."+pad(w.id)+"</td><td>"+escSvg(w.title)+"</td>"+
      "<td>"+w.age+" 岁</td><td>"+w.date+"</td><td>"+escSvg(w.medium)+"</td><td>"+(w.size||"-")+"</td></tr>";
  }
  h+="</table>";
  return h;
}

/* ===== 路由 ===== */
function go(p){
  var nv=document.getElementById("nv");
  if(nv)nv.classList.remove("open");
}
function render(){
  var hash=location.hash||"#/";
  var parts=hash.replace("#/","").split("/");
  var page=parts[0]||"";
  var sub=parts[1]||"";
  var app=document.getElementById("app");

  if(page===""||page==="/"){app.innerHTML=rHome();}
  else if(page==="halls"){app.innerHTML=rHalls(sub);}
  else if(page==="themes"){app.innerHTML=rThemes();}
  else if(page==="game"){app.innerHTML=rGame();}
  else if(page==="book"){app.innerHTML=rBook();}
  else if(page==="index"){app.innerHTML=rIndex();}
  else{app.innerHTML=rHome();}

  var links=document.querySelectorAll("nav a");
  for(var i=0;i<links.length;i++){
    var href=links[i].getAttribute("href")||"";
    var hp=href.replace("#/","");
    links[i].classList.toggle("on",hp===page||(page===""&&hp==="/"));
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();
</script>
